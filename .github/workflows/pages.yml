name: Publish sample to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:types
      - run: npm pack --ignore-scripts --pack-destination demo
      - name: Check out the publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Update the published sample
        run: |
          touch demo/.nojekyll
          node -e 'require("node:fs").writeFileSync("demo/deployment.json", JSON.stringify({repository: process.env.GITHUB_REPOSITORY, sourceCommit: process.env.GITHUB_SHA, version: require("./package.json").version}, null, 2) + "\n")'
          rsync -a --delete --exclude='.git/' demo/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish sample for ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
